<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#070707">

  <meta name="description" content="Zubeen Garg Assamese Music">

  <title>Zubeen — Assamese Music</title>


  <!-- Preconnect -->

  <link rel="preconnect" href="https://www.youtube.com">

  <link rel="preconnect" href="https://i.ytimg.com">


  <!-- CSS -->

  <link rel="stylesheet" href="./style.css">

</head>


<body>


  <!-- =================================================
         BACKGROUND
    ================================================== -->

  <div class="background" aria-hidden="true">
  </div>


  <!-- =================================================
         TOP BAR
    ================================================== -->

  <header class="topbar">


    <div class="brand">
      ZUBEEN
    </div>


    <div class="status">

      <span></span>

      LIVE MUSIC

    </div>


  </header>


  <!-- =================================================
         CENTER SEARCH BUTTON
    ================================================== -->

  <button id="openSearch" type="button" aria-label="Open search">

    <!-- SVG inserted by JS -->

  </button>


  <!-- =================================================
         SEARCH
    ================================================== -->

  <div id="topSearch" role="search">


    <div id="searchBox" class="search-box">


      <input id="search" type="search" placeholder="Search a Zubeen song..." autocomplete="off" spellcheck="false"
        maxlength="100" aria-label="Search Zubeen song">


      <button id="searchButton" type="button" aria-label="Search">

        <!-- SVG -->

      </button>


      <button id="closeSearch" type="button" aria-label="Close search">

        <!-- SVG -->

      </button>


    </div>


    <div id="searchStatus" aria-live="polite">
    </div>


  </div>


  <!-- =================================================
         MAIN
    ================================================== -->

  <main class="content">


    <section class="intro">


      <div class="eyebrow">

        ASSAMESE MUSIC ARCHIVE

      </div>


      <h1>

        Zubeen
        <br>

        <em>Garg.</em>

      </h1>


      <p class="sub">

        A small space for the songs,
        melodies and memories of
        Assam's beloved voice.

      </p>


    </section>


    <!-- =================================================
             RESULTS
        ================================================== -->

    <section class="results-section" aria-label="Search results">


      <div id="songs" aria-live="polite">
      </div>


    </section>


  </main>


  <!-- =================================================
         MUSIC PLAYER
    ================================================== -->

  <section class="player" aria-label="Music player">


    <!-- SONG -->

    <div class="now">


      <div class="cover" aria-hidden="true">

        <span>
          ZG
        </span>

      </div>


      <div>

        <strong id="nowTitle">

          Select a song

        </strong>


        <small id="nowArtist">

          Zubeen Garg

        </small>

      </div>


    </div>


    <!-- CONTROLS -->

    <div class="controls">


      <button id="prev" type="button" aria-label="Previous song">
      </button>


      <button id="play" class="play" type="button" aria-label="Play song">
      </button>


      <button id="next" type="button" aria-label="Next song">
      </button>


    </div>


    <!-- TIMELINE -->

    <div class="timeline">


      <span id="current">
        0:00
      </span>


      <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Song progress">


      <span id="duration">
        0:00
      </span>


    </div>


    <!-- VOLUME -->

    <div class="volume">


      <span aria-hidden="true">

        <svg class="icon icon-small" viewBox="0 0 24 24">

          <path d="M4 10v4h4l5 4V6l-5 4z">
          </path>

          <path d="M16 9c1.5 1.5 1.5 4.5 0 6">
          </path>

          <path d="M19 6.5c3 3 3 8 0 11">
          </path>

        </svg>

      </span>


      <input id="volume" type="range" min="0" max="100" value="70" step="1" aria-label="Volume">


    </div>


  </section>


  <!-- =================================================
         YOUTUBE PLAYER
    ================================================== -->

  <div id="yt-player" class="youtube-player" aria-hidden="true">
  </div>


  <!-- =================================================
         YOUTUBE API
    ================================================== -->

  <script src="https://www.youtube.com/iframe_api">
  </script>


  <!-- =================================================
         APP SCRIPT
    ================================================== -->

  <script src="./script.js">
  </script>


</body>

</html>
